name: Python quality environment
description: Set up Python and restore pip cache for lint and test jobs
inputs:
  python-version:
    description: Python version to install
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python with pip cache
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install Ruff
      shell: bash
      run: python -m pip install --disable-pip-version-check ruff
