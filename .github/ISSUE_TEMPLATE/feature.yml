name: Feature request
description: Suggest a feature or improvement for StudyMate
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 사용자 문제나 요구가 있나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 기능이 어떻게 동작해야 하는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료 여부를 확인할 수 있는 조건을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - frontend
        - backend
        - testing
        - documentation
    validations:
      required: true