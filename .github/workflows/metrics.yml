name: Track Lead Time

on:
  pull_request:
    types: [closed]

jobs:
  track-lead-time:
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - self-hosted

    steps:
      - name: Calculate Lead Time
        env:
          METRICS_RUNNER_OS: ${{ runner.os }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          created_at = event["pull_request"]["created_at"]
          merged_at = event["pull_request"]["merged_at"]

          def parse_iso8601(value: str) -> datetime:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          first_commit_time = parse_iso8601(created_at)
          merge_time = parse_iso8601(merged_at)
          lead_time = int((merge_time - first_commit_time).total_seconds())

          result = {
              "schemaVersion": 1,
              "metric": "pull-request-lead-time",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pullRequestNumber": event["pull_request"]["number"],
              "runnerOs": os.environ["METRICS_RUNNER_OS"],
              "createdAt": created_at,
              "mergedAt": merged_at,
              "leadTimeSeconds": lead_time,
          }
          with open("lead-time.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Lead Time: {lead_time} seconds")
          PY

      - name: Upload lead-time data
        uses: actions/upload-artifact@v4
        with:
          name: lead-time-${{ github.event.pull_request.number }}-${{ matrix.os }}
          path: lead-time.json
          if-no-files-found: error
          retention-days: 90
