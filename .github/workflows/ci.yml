name: Build, Test and Deploy

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: school-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check out source for path detection
        uses: actions/checkout@v4
      - name: Detect paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - 'wireframe.html'
              - 'assets/**'
              - 'scripts/build.py'
            code:
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/actions/**'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  build:
    name: Build website artifact
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: ./.github/actions/python-quality
        with:
          python-version: "3.12"
      - name: Build static site
        run: python scripts/build.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  quality:
    name: Reusable cross-platform checks
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/reusable-python-checks.yml
    permissions:
      contents: read

  deploy:
    name: Deploy website
    needs: [changes, build, quality]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.site == 'true' &&
      needs.build.result == 'success' &&
      needs.quality.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify deployment webhook (optional)
        if: env.DEPLOYMENT_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ env.DEPLOYMENT_WEBHOOK_URL }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --request POST "$WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data "{"repository":"$GITHUB_REPOSITORY","url":"$DEPLOYMENT_URL"}"
