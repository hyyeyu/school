name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python scripts/build.py

      - name: Upload build artifact for tests
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  test:
    name: Lint and test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tool
        run: python -m pip install --disable-pip-version-check ruff

      - name: Lint Python scripts and tests
        run: ruff check scripts tests

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Run smoke tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional: configure DEPLOYMENT_WEBHOOK_URL under
      # Settings > Secrets and variables > Actions > Repository secrets.
      - name: Notify external deployment monitor (optional)
        if: env.DEPLOYMENT_WEBHOOK_URL != ''
        env:
          DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 15 \
            --request POST "$DEPLOYMENT_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data "{\"repository\":\"$GITHUB_REPOSITORY\",\"url\":\"$DEPLOYMENT_URL\"}"
